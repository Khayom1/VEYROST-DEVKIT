<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">VEYROST-DEVKIT animated repository scanner mark</title>
  <desc id="desc">A scanning beam moves over a constellation of repository files, representing local code health analysis.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071322"/>
      <stop offset="1" stop-color="#132b46"/>
    </linearGradient>
    <linearGradient id="beam">
      <stop offset="0" stop-color="#61e8ce" stop-opacity="0"/>
      <stop offset=".5" stop-color="#61e8ce" stop-opacity=".9"/>
      <stop offset="1" stop-color="#61e8ce" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="screen"><rect x="38" y="38" width="300" height="184" rx="22"/></clipPath>
  </defs>
  <rect width="900" height="260" rx="28" fill="url(#background)"/>
  <g clip-path="url(#screen)">
    <rect x="38" y="38" width="300" height="184" rx="22" fill="#0a1729" stroke="#42627e" stroke-width="2"/>
    <g stroke="#294661" stroke-width="2" fill="none">
      <path d="M82 92L145 67L206 105L281 72M82 92L122 164L206 105L266 166L281 72M122 164L195 195L266 166"/>
      <path d="M145 67L195 195"/>
    </g>
    <g fill="#8bf1df" filter="url(#glow)">
      <circle cx="82" cy="92" r="7"/><circle cx="145" cy="67" r="7"/>
      <circle cx="206" cy="105" r="9"/><circle cx="281" cy="72" r="7"/>
      <circle cx="122" cy="164" r="7"/><circle cx="195" cy="195" r="7"/>
      <circle cx="266" cy="166" r="7"/>
    </g>
    <rect x="38" y="0" width="300" height="7" fill="url(#beam)" opacity=".95">
      <animate attributeName="y" values="38;218;38" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g fill="#eef8ff" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="385" y="104" font-size="38" font-weight="800" letter-spacing="2">VEYROST</text>
    <text x="385" y="151" font-size="27" font-weight="600" fill="#83e8d6" letter-spacing="5">DEVKIT</text>
    <text x="385" y="192" font-size="16" fill="#a9bfd4" letter-spacing="2">LOCAL REPOSITORY INTELLIGENCE</text>
  </g>
  <path d="M385 215H824" stroke="#31516e" stroke-width="2"/>
  <circle cx="841" cy="215" r="5" fill="#83e8d6">
    <animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
